<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070923" />
    <title>Anmelden · Quizly</title>
    <meta
      name="description"
      content="Bei Quizly anmelden oder ohne Konto als Gast die Beispiel-Quizze ausprobieren."
    />
    <link rel="stylesheet" href="../shared/css/fonts.css" />
    <link rel="stylesheet" href="../shared/css/variables.css" />
    <link rel="stylesheet" href="../shared/css/standart.css" />
    <link rel="stylesheet" href="../shared/css/toastmsg.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="../shared/css/auth.css" />
    <link rel="icon" href="../assets/icons/robot_default.png" type="image/png" />
    <script src="../shared/js/config.js" defer></script>
    <script src="../shared/js/helper.js" defer></script>
    <script src="../shared/js/session.js" defer></script>
    <script src="../shared/js/template.js" defer></script>
    <script src="../shared/js/auth.js" defer></script>
    <script src="../shared/js/auth-page.js" defer></script>
  </head>
  <body class="auth-page">
    <a class="skip-link" href="#main">Zum Inhalt springen</a>
    <header class="auth-header">
      <a href="/index.html" class="auth-header__logo">
        <img src="/assets/icons/logoheader.png" alt="Quizly Startseite" width="150" height="43" />
      </a>
    </header>

    <main id="main" class="auth-main">
      <article class="auth-card" aria-labelledby="auth-title">
        <img src="/assets/icons/robot_default.webp" alt="" width="454" height="379" class="auth-card__robot" />
        <h1 id="auth-title">Anmelden</h1>
        <p id="auth-notice" class="auth-notice" role="status" hidden></p>

        <form class="auth-form" onsubmit="loginUser(event); return false" novalidate>
          <div class="field">
            <label for="input-username">Benutzername</label>
            <input
              class="field__input"
              type="text"
              id="input-username"
              name="username"
              spellcheck="false"
              autocapitalize="off"
              autocomplete="username"
              required
            />
            <p class="error-message" aria-live="polite"></p>
          </div>

          <div class="field field--password">
            <label for="input-password">Passwort</label>
            <input
              class="field__input"
              type="password"
              id="input-password"
              name="password"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="field__toggle"
              id="input-lock-password"
              aria-label="Passwort anzeigen"
              aria-pressed="false"
            >
              <img src="/assets/icons/visibility_off.svg" alt="" width="24" height="24" />
            </button>
            <p class="error-message" aria-live="polite"></p>
          </div>

          <button type="submit" class="button button--primary auth-form__submit">Anmelden</button>
        </form>

        <p class="auth-switch">
          Noch kein Konto? <a href="registration.html">Jetzt registrieren</a>
        </p>

        <div class="auth-guest">
          <h2>Ohne Konto ausprobieren</h2>
          <p>
            Als Gast siehst du drei Beispiel-Quizze und kannst sie lösen. Eigene Quizze erstellen
            geht mit einem kostenlosen Konto.
          </p>
          <button type="button" class="button button--secondary" onclick="loginAsGuest()">
            Als Gast testen
          </button>
        </div>
      </article>
    </main>

    <footer id="footer" class="site-footer"></footer>
    <img src="/assets/icons/wavelogin.webp" alt="" width="1920" height="548" class="auth-wave" loading="lazy" decoding="async" />
  </body>
</html>
