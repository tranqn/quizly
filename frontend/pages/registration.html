<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrieren · Quizly</title>
    <meta
      name="description"
      content="Kostenloses Quizly-Konto anlegen und aus eigenen YouTube-Videos Quizze erstellen."
    />
    <link rel="stylesheet" href="../shared/css/fonts.css" />
    <link rel="stylesheet" href="../shared/css/variables.css" />
    <link rel="stylesheet" href="../shared/css/standart.css" />
    <link rel="stylesheet" href="../shared/css/toastmsg.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="../shared/css/auth.css" />
    <link rel="icon" href="../assets/icons/robot_default.png" type="image/png" />
    <script src="../shared/js/config.js" defer></script>
    <script src="../shared/js/helper.js" defer></script>
    <script src="../shared/js/session.js" defer></script>
    <script src="../shared/js/template.js" defer></script>
    <script src="../shared/js/auth.js" defer></script>
    <script src="../shared/js/auth-page.js" defer></script>
  </head>
  <body class="auth-page">
    <a class="skip-link" href="#main">Zum Inhalt springen</a>
    <header class="auth-header">
      <a href="/index.html" class="auth-header__logo">
        <img src="/assets/icons/logoheader.png" alt="Quizly Startseite" width="150" height="43" />
      </a>
    </header>

    <main id="main" class="auth-main">
      <article class="auth-card" aria-labelledby="auth-title">
        <img src="/assets/icons/robot_default.webp" alt="" width="454" height="379" class="auth-card__robot" />
        <h1 id="auth-title">Konto erstellen</h1>
        <p id="auth-notice" class="auth-notice" role="status" hidden></p>

        <form class="auth-form" onsubmit="signUpUser(event); return false" novalidate>
          <div class="field">
            <label for="input-username">Benutzername</label>
            <input
              class="field__input"
              type="text"
              id="input-username"
              name="username"
              autocomplete="username"
              required
            />
            <p class="error-message" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="input-email">E-Mail</label>
            <input
              class="field__input"
              type="email"
              id="input-email"
              name="email"
              autocomplete="email"
              required
            />
            <p class="error-message" aria-live="polite"></p>
          </div>

          <div class="field field--password">
            <label for="input-password">Passwort</label>
            <input
              class="field__input"
              type="password"
              id="input-password"
              name="password"
              autocomplete="new-password"
              aria-describedby="password-rules"
              required
            />
            <button
              type="button"
              class="field__toggle"
              id="input-lock-password"
              aria-label="Passwort anzeigen"
              aria-pressed="false"
            >
              <img src="/assets/icons/visibility_off.svg" alt="" width="24" height="24" />
            </button>
            <p id="password-rules" class="field__hint">
              Mindestens 6 Zeichen, davon ein Groß- und ein Kleinbuchstabe und eine Ziffer.
            </p>
            <p class="error-message" aria-live="polite"></p>
          </div>

          <div class="field field--password">
            <label for="input-rep-password">Passwort wiederholen</label>
            <input
              class="field__input"
              type="password"
              id="input-rep-password"
              name="repeated-password"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="field__toggle"
              id="input-lock-repeated-pw"
              aria-label="Passwort anzeigen"
              aria-pressed="false"
            >
              <img src="/assets/icons/visibility_off.svg" alt="" width="24" height="24" />
            </button>
            <p class="error-message" aria-live="polite"></p>
          </div>

          <div class="checkbox-wrapper">
            <label>
              <input type="checkbox" id="terms-checkbox" name="terms" />
              <span>Ich habe die <a href="privacy.html">Datenschutzerklärung</a> gelesen.</span>
            </label>
            <p class="error-message" id="checkbox-error" aria-live="polite"></p>
          </div>

          <button type="submit" class="button button--primary auth-form__submit">Konto erstellen</button>
        </form>

        <p class="auth-switch">
          Schon registriert? <a href="login.html">Zur Anmeldung</a>
        </p>
      </article>
    </main>

    <footer id="footer" class="site-footer"></footer>
    <img src="/assets/icons/wavelogin.webp" alt="" class="auth-wave" loading="lazy" decoding="async" />
  </body>
</html>
