<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070923" />
    <title>Quiz lösen · Quizly</title>
    <meta name="description" content="Ein Quizly-Quiz lösen und Frage für Frage auswerten." />
    <link rel="stylesheet" href="/shared/css/fonts.css" />
    <link rel="stylesheet" href="/shared/css/variables.css" />
    <link rel="stylesheet" href="/shared/css/standart.css" />
    <link rel="stylesheet" href="/shared/css/toastmsg.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="/shared/css/app.css" />
    <link rel="stylesheet" href="/shared/css/quiz.css" />
    <link rel="icon" href="/assets/icons/robot_default.png" type="image/png" />
    <script src="/shared/js/config.js" defer></script>
    <script src="/shared/js/helper.js" defer></script>
    <script src="/shared/js/session.js" defer></script>
    <script src="/shared/js/template.js" defer></script>
    <script src="/shared/js/auth.js" defer></script>
    <script src="/shared/js/api.js" defer></script>
    <script src="/shared/js/quiz.js" defer></script>
  </head>
  <body class="app-page" onload="initQuiz()">
    <a class="skip-link" href="#main">Zum Inhalt springen</a>
    <header id="app-header" class="app-header"></header>

    <main id="main" class="app-main quiz-main">
      <a id="back-link" class="button button--text quiz-back" href="/pages/library.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6" />
        </svg>
        Zur Quiz-Übersicht
      </a>

      <p id="quiz-loading" class="quiz-state" role="status">Quiz wird geladen …</p>
      <div id="quiz-error" class="quiz-state" role="alert" hidden>
        <p>Dieses Quiz gibt es nicht oder es gehört zu einem anderen Konto.</p>
        <a class="button button--secondary" href="/pages/library.html">Zur Bibliothek</a>
      </div>

      <section id="quiz-play" class="quiz-play" aria-labelledby="quiz-title" hidden>
        <p id="quiz-title" class="quiz-play__title"></p>

        <div class="quiz-progress">
          <p id="question-amount" class="quiz-progress__label"></p>
          <div
            id="quiz-progress-bar"
            class="quiz-progress__bar"
            role="progressbar"
            aria-labelledby="question-amount"
            aria-valuemin="0"
          >
            <span></span>
          </div>
        </div>

        <fieldset class="question">
          <legend class="question__legend">
            <h1 id="question-title" class="question__title" tabindex="-1"></h1>
          </legend>
          <div id="answers" class="answers"></div>
        </fieldset>

        <div class="quiz-nav">
          <button id="prev-button" type="button" class="button button--text">Vorherige Frage</button>
          <button id="next-button" type="button" class="button button--primary" disabled>Weiter</button>
        </div>
        <p class="quiz-hint">Tipp: Mit 1 bis 4 oder A bis D wählst du eine Antwort, mit Enter geht es weiter.</p>
      </section>

      <section id="quiz-result" class="quiz-result" aria-labelledby="result-title" hidden>
        <div class="result-summary">
          <div id="score-ring" class="score-ring">
            <span id="score-percent"></span>
          </div>
          <div>
            <h1 id="result-title" tabindex="-1"></h1>
            <p id="result-text" class="result-summary__text"></p>
            <div class="result-actions">
              <button type="button" class="button button--primary" onclick="restartQuiz(true)">Nochmal lösen</button>
              <a class="button button--secondary" href="/pages/library.html">Zur Bibliothek</a>
            </div>
          </div>
        </div>

        <h2 class="review__heading">Deine Antworten</h2>
        <ol id="answer-review" class="review"></ol>
      </section>
    </main>

    <footer id="footer" class="site-footer"></footer>
  </body>
</html>
