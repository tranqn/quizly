# Quizly — quality gate on GitHub's runners, deploy on the Hetzner box.
#
# The deploy job runs on a self-hosted runner inside my own server, so nothing
# here may ever be triggered by a fork: the workflow has no pull_request trigger
# that reaches it, and the job additionally refuses anything but a push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Django checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The full list, whisper and torch included. They are only imported lazily
      # inside quiz_app/api/services.py, so the checks below would pass without
      # them — but then CI would stop noticing when that install breaks, which is
      # the thing that actually takes the quiz pipeline down. pip's cache keeps
      # the cost to the first run after a dependency change.
      - run: pip install -r requirements.txt

      - name: System checks
        run: python manage.py check

      - name: Migrations are in sync with the models
        run: python manage.py makemigrations --check --dry-run

      # Whitenoise serves the vanilla-JS frontend from FRONTEND_DIR, so a broken
      # static setup means a blank site. STATIC_ROOT is hardcoded to
      # backend/staticfiles; in a CI workspace that is throwaway anyway.
      - name: Static files collect
        run: python manage.py collectstatic --noinput --clear

  deploy:
    name: Deploy to Hetzner
    needs: [backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, hetzner, deploy]
    concurrency:
      group: deploy-quizly
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Deploy
        env:
          SHA: ${{ github.sha }}
        run: /opt/ci/bin/deploy quizly "$SHA"
